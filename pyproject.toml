[project]
name = "kaggle2q1q4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gdown>=6.4.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.13"
